server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tax-compliance-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taxdb}
    username: ${DB_USER:taxuser}
    password: ${DB_PASSWORD:taxpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

API_ADMIN_USER: ${API_ADMIN_USER:admin}
API_ADMIN_PASSWORD: ${API_ADMIN_PASSWORD:changeme123}