apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-compliance-api
  namespace: tax-app
  labels:
    app: tax-compliance-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tax-compliance-api
  template:
    metadata:
      labels:
        app: tax-compliance-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: tax-compliance-api
          image: romeroperezpaula/tax-compliance-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tax-app-config
            - secretRef:
                name: tax-app-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: tax-compliance-service
  namespace: tax-app
  labels:
    app: tax-compliance-api
spec:
  selector:
    app: tax-compliance-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: LoadBalancer